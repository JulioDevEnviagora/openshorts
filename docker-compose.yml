services:
  backend:
    build: .
    container_name: openshorts-backend
    ports:
      - "8000:8000"
    environment:
      - AI_PROVIDER=${AI_PROVIDER:-openrouter}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - OPENROUTER_IMAGE_MODEL=${OPENROUTER_IMAGE_MODEL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      # Writable named volumes (PR #4). The image already has the code and
      # baked yolov8n.pt — do not bind-mount the checkout over /app (Dokploy
      # clones as root and that hid the weights + /app/.config).
      - UPLOAD_DIR=/app/uploads
      - OUTPUT_DIR=/app/output
      - HOME=/tmp
      - MPLCONFIGDIR=/tmp/matplotlib
      - YOLO_CONFIG_DIR=/tmp/Ultralytics
      - XDG_CONFIG_HOME=/tmp/.config
      - XDG_CACHE_HOME=/tmp/.cache
      - YOLO_WEIGHTS=/opt/models/yolov8n.pt
    volumes:
      - uploads_data:/app/uploads
      - output_data:/app/output
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: openshorts-frontend
    ports:
      - "5175:5173"
    # Extra Vite Host headers (comma-separated). Defaults already include
    # openshorts.app, www.openshorts.app and openshorts.julioakamine.com.
    environment:
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-}
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    ports:
      - "3100:3100"
    volumes:
      - output_data:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  uploads_data:
  output_data:
